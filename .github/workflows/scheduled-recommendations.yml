name: Scheduled Shopify recommendations

on:
  schedule:
    # Primary run: 04:07 Los Angeles local time, every Monday and Thursday.
    - cron: "7 4 * * 1,4"
      timezone: "America/Los_Angeles"
    # Backup run: only writes when no successful run exists in the last 90 minutes.
    - cron: "47 4 * * 1,4"
      timezone: "America/Los_Angeles"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: shopify-recommendations-write
  queue: max

jobs:
  write-recommendations:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SHOPIFY_STORE_DOMAIN: ${{ secrets.SHOPIFY_STORE_DOMAIN }}
      SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
      SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
      SHOPIFY_API_VERSION: ${{ vars.SHOPIFY_API_VERSION || '2026-07' }}
      ALLOW_SHOPIFY_WRITE: "true"
      EMPTY_RECOMMENDATIONS: ${{ vars.EMPTY_RECOMMENDATIONS || 'preserve' }}
      SIZE_OPTION_NAMES: ${{ vars.SIZE_OPTION_NAMES || 'Size,Mattress Size,Bed Size' }}
      TWIN_MATTRESS_COLLECTION: ${{ vars.TWIN_MATTRESS_COLLECTION }}
      TWIN_XL_MATTRESS_COLLECTION: ${{ vars.TWIN_XL_MATTRESS_COLLECTION }}
      FULL_MATTRESS_COLLECTION: ${{ vars.FULL_MATTRESS_COLLECTION }}
      QUEEN_MATTRESS_COLLECTION: ${{ vars.QUEEN_MATTRESS_COLLECTION }}
      KING_MATTRESS_COLLECTION: ${{ vars.KING_MATTRESS_COLLECTION }}
      CALIFORNIA_KING_MATTRESS_COLLECTION: ${{ vars.CALIFORNIA_KING_MATTRESS_COLLECTION }}
      SPLIT_KING_MATTRESS_COLLECTION: ${{ vars.SPLIT_KING_MATTRESS_COLLECTION }}
      SPLIT_CALIFORNIA_KING_MATTRESS_COLLECTION: ${{ vars.SPLIT_CALIFORNIA_KING_MATTRESS_COLLECTION }}
      TWIN_ADJUSTABLE_BASE_COLLECTION: ${{ vars.TWIN_ADJUSTABLE_BASE_COLLECTION }}
      TWIN_XL_ADJUSTABLE_BASE_COLLECTION: ${{ vars.TWIN_XL_ADJUSTABLE_BASE_COLLECTION }}
      FULL_ADJUSTABLE_BASE_COLLECTION: ${{ vars.FULL_ADJUSTABLE_BASE_COLLECTION }}
      QUEEN_ADJUSTABLE_BASE_COLLECTION: ${{ vars.QUEEN_ADJUSTABLE_BASE_COLLECTION }}
      KING_ADJUSTABLE_BASE_COLLECTION: ${{ vars.KING_ADJUSTABLE_BASE_COLLECTION }}
      CALIFORNIA_KING_ADJUSTABLE_BASE_COLLECTION: ${{ vars.CALIFORNIA_KING_ADJUSTABLE_BASE_COLLECTION }}
      SPLIT_KING_ADJUSTABLE_BASE_COLLECTION: ${{ vars.SPLIT_KING_ADJUSTABLE_BASE_COLLECTION }}
      SPLIT_CALIFORNIA_KING_ADJUSTABLE_BASE_COLLECTION: ${{ vars.SPLIT_CALIFORNIA_KING_ADJUSTABLE_BASE_COLLECTION }}

    steps:
      - name: Decide whether this run should write
        id: gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
        run: |
          run_needed=true
          if [[ "$GITHUB_EVENT_NAME" == "schedule" && "$TRIGGER_SCHEDULE" == "47 4 * * 1,4" ]]; then
            cutoff=$(date -u -d '90 minutes ago' '+%Y-%m-%dT%H:%M:%SZ')
            if response=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/workflows/scheduled-recommendations.yml/runs?event=schedule&per_page=20"); then
              successful=$(jq --arg cutoff "$cutoff" --argjson current "$GITHUB_RUN_ID" \
                '[.workflow_runs[] | select(.id != $current and .conclusion == "success" and .created_at >= $cutoff)] | length' <<< "$response")
              if (( successful > 0 )); then
                run_needed=false
                echo "A recent scheduled run succeeded; the backup write will be skipped."
              fi
            else
              echo "::warning::Could not inspect recent workflow runs; backup will proceed safely."
            fi
          fi
          echo "run=$run_needed" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v7

      - name: Set up Node.js
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22.14.0"
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm ci

      - name: Validate project
        if: steps.gate.outputs.run == 'true'
        run: npm run check

      - name: Write Shopify recommendations
        if: steps.gate.outputs.run == 'true'
        run: npm run recommendations:write -- --confirm-write

      - name: Upload run reports
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: recommendation-write-${{ github.run_id }}
          path: |
            output/**/run-summary.json
            output/**/recommendations-audit.xlsx
            output/**/write-results.xlsx
            output/**/pre-write-snapshot.jsonl
          if-no-files-found: warn
          retention-days: 14
